name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    # id-token: write e obrigatorio para o OIDC do Infisical (o callable so
    # recebe o id-token se o job chamador conceder). Os demais espelham o que o
    # callable declara, para nao restringir o GITHUB_TOKEN abaixo do necessario.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      models: read
      id-token: write
    uses: mri-Qbox-Brasil/workflows/.github/workflows/callable-release.yml@main
    # Secrets explicitos em vez de `secrets: inherit`. Sao os mesmos que o
    # inherit passaria, mas nomeados: com o inherit, um secret ausente e um
    # secret com nome errado produzem exatamente o mesmo sintoma (nada acontece,
    # sem log), e o mri_Qadmin — unico resource desta suite que releasa de fato —
    # ja os declara assim.
    #
    # Todos sao `required: false` no callable: sem GH_TOKEN nao ha permissao para
    # criar tag/release; sem UPDATE_DISCORD_WEBHOOK o release sai mas nao avisa
    # no Discord; os quatro de URL so afetam a arte do embed.
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
      UPDATE_DISCORD_WEBHOOK: ${{ secrets.UPDATE_DISCORD_WEBHOOK }}
      LOGO_MRIQBOX_URL: ${{ secrets.LOGO_MRIQBOX_URL }}
      RESOURCE_MRIQBOX_URL: ${{ secrets.RESOURCE_MRIQBOX_URL }}
      INVITE_DISCORD_URL: ${{ secrets.INVITE_DISCORD_URL }}
      DOCS_MRIQBOX_URL: ${{ secrets.DOCS_MRIQBOX_URL }}
