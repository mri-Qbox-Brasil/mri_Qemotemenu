name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    # id-token: write e obrigatorio para o OIDC do Infisical (o callable so
    # recebe o id-token se o job chamador conceder). Os demais espelham o que o
    # callable declara, para nao restringir o GITHUB_TOKEN abaixo do necessario.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      models: read
      id-token: write
    uses: mri-Qbox-Brasil/workflows/.github/workflows/callable-release.yml@main
    # `secrets: inherit` de proposito, e nao uma lista explicita.
    #
    # O token nao vem daqui: o callable busca no Infisical por OIDC
    # (Infisical/secrets-action, method: oidc) e resolve tudo como
    # `${{ env.GH_TOKEN || secrets.GH_TOKEN }}` — env primeiro. Nao e preciso
    # criar PAT por repositorio; os `secrets.*` sao so o fallback de quando o
    # Infisical esta fora, e o proprio callable documenta o inherit como a forma
    # desse fallback.
    #
    # Alem disso, `release.yml` nao esta no .templatesyncignore: o sync semanal
    # com o script-template sobrescreve este arquivo, entao qualquer desvio do
    # padrao aqui volta atras sozinho na segunda-feira seguinte.
    secrets: inherit
